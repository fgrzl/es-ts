name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: es-ts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package
        run: |
          if [ "$(node -pe "require('./package.json').private")" = "true" ]; then
            echo "Package is private; skipping publish."
          else
            npm publish --access public
          fi
