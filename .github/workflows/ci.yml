name: CI

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main

  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test
